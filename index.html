<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vedah</title>
<meta name="description" content="vedah.nl — Vedah's portfolio.">
<style>
  :root {
    --bg: #f6f1ea;
    --ink: #2b2420;
    --muted: #7a6e66;
    --accent: #b5654a;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: Georgia, "Times New Roman", serif;
    display: grid;
    place-items: center;
    padding: 2rem;
  }
  main { text-align: center; max-width: 36rem; }
  .mark {
    width: 3rem; height: 3rem; margin: 0 auto 2rem;
    border: 1.5px solid var(--accent); border-radius: 50%;
    display: grid; place-items: center;
    color: var(--accent); font-size: 1.25rem; font-style: italic;
  }
  h1 {
    font-weight: normal;
    font-size: clamp(2.75rem, 9vw, 5rem);
    letter-spacing: -0.02em;
    line-height: 1;
  }
  p {
    margin-top: 1.25rem;
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    font-size: 1rem;
    color: var(--muted);
    letter-spacing: 0.04em;
  }
  .line {
    width: 2.5rem; height: 1px; background: var(--accent);
    margin: 1.75rem auto 0;
  }
</style>
</head>
<body>
<main>
  <div class="mark">v</div>
  <h1>Vedah</h1>
  <div class="line"></div>
  <p>Online soon</p>
</main>
</body>
</html>
